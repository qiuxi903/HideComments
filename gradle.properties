org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# 项目路径含中文（干掉评论区），AGP 默认直接报错拒绝构建，这里显式豁免。
# 本项目 release 不开 minify（关闭了 R8），不涉及 R8 在非 ASCII 路径下的已知问题。
android.overridePathCheck=true

# 更关键的一条：Kotlin 编译守护进程是独立子进程，它把非 ASCII 路径转义后传给 javac，
# javac 找不到文件（"source file or directory not found: G:\project\u5220..."）。
# 改成进程内编译就没有这个跨进程的路径转义问题。
kotlin.compiler.execution.strategy=in-process

kotlin.code.style=official
